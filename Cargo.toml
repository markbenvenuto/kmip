# [package]
# name = "kmip"
# version = "0.1.0"
# authors = ["Mark Benvenuto <mark.benvenuto@mongodb.com>"]
# edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    "client",
    "kmip_client",
    "kmip_protocol",
    "server",
    "tests_e2e",
    "ttlv",
    "ttlv_derive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aes = "0.9"
aws-lc-rs = "1.19"
block-padding = "0.4"
bson = { version = "3.1", features = ["serde"] }
byteorder = "1.5"
cbc = { version = "0.2", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
clap = "4.6"
clap-verbosity-flag = "3.0"
crypto-common = "0.2"
digest = "0.11"
ecb = { version = "0.2", features = ["alloc"] }
futures = "0.3"
heck = "0.5"
hex = "0.4"
hmac = "0.13"
kmip_client = { path = "kmip_client" }
kmip_protocol = { path = "kmip_protocol" }
kmip_server = { path = "server" }
lazy_static = "1.5"
mongodb = { version = "3.10", default-features = false, features = ["sync", "bson-3", "compat-3-3-0", "dns-resolver", "rustls-tls"] }
num = "0.4"
num-derive = "0.5"
num-traits = "0.2"
pretty-hex = "0.4"
proc-macro2 = "1.0"
quick-xml = "0.42"
quote = "1.0"
regex = "1.13"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = "1.0"
serde_derive = "1.0"
sha2 = "0.11"
similar = "3.2"
strum = "0.28"
strum_macros = "0.28"
syn = { version = "3.0", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ttlv = { path = "ttlv" }
ttlv_derive = { path = "ttlv_derive" }
webpki-roots = "1.0"
xml = "1.4"
